<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>try{if(localStorage.getItem("ui-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>
:root{color-scheme:dark;--ink:#f4ead2;--mu:#a9a1c8;--ln:rgba(190,160,255,.22);--gold:#e0b45a;--em:#d9546e;--teal:#3fc6b8}
:root[data-theme="light"]{color-scheme:light;--ink:#30233f;--mu:#665c74;--ln:rgba(93,62,122,.22);--gold:#94600d;--em:#ad3554;--teal:#087f78;--gl:rgba(255,250,239,.84)}
:root[data-theme="light"] body{background:#f4efe6;color:var(--ink)}
:root[data-theme="light"] .bg{background:radial-gradient(ellipse at 50% 130%,#e4d9f5,transparent 60%),#f4efe6}
:root[data-theme="light"] .bg .aur{background:conic-gradient(from 0deg,#c9b7f0,#f4efe6 18%,#a9e3dc 32%,#f4efe6 48%,#f1dba5 62%,#f4efe6 76%,#f3bdca 88%,#c9b7f0);opacity:.32}
:root[data-theme="light"] .bg i:nth-of-type(n){opacity:.15}
:root[data-theme="light"] .bg svg{opacity:.3}
.lw{position:relative}
#lb{display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--ink);font:600 15px "Crimson Pro",serif;padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--cb)}
#lm{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:min(78vw,300px);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-radius:16px;border:1px solid var(--ln);background:var(--cb);}
#lm[hidden]{display:none}
#lm button{cursor:pointer;color:var(--ink);background:none;border:1px solid transparent;border-radius:10px;padding:8px;font:inherit;font-size:16px}
#lm button:hover,#lm button.on{border-color:var(--gold);background:rgba(224,180,90,.12)}
.tg{position:relative;width:68px;height:34px;border-radius:99px;border:1px solid var(--ln);cursor:pointer;padding:0;overflow:hidden;background:radial-gradient(2px 2px at 14px 9px,#fff,transparent),radial-gradient(1.5px 1.5px at 28px 22px,#fff,transparent),radial-gradient(1.5px 1.5px at 40px 8px,#fff,transparent),#1a0f3d;transition:background .6s}
.tg .kn{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;box-shadow:inset -8px -3px 0 0 #f4ead2;transform:rotate(-20deg);transition:all .6s cubic-bezier(.5,1.6,.5,1)}
:root[data-theme=light] .tg{background:linear-gradient(#7fd0ff,#d8f1ff)}
:root[data-theme=light] .tg .kn{left:38px;background:#ffb92e;box-shadow:0 0 14px 5px #ffd36a;transform:rotate(180deg)}
:root[data-theme=light] .tg .kn::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dotted #ffb92e;animation:spin 8s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(0)}60%{transform:scale(1.5)}}
.lg{display:block;width:88px;height:88px;margin:0 auto 4px;animation:fl 5s ease-in-out infinite}
.lg circle,.lg path{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s .3s ease forwards}
.lg .sp{fill:var(--gold);stroke:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:0;animation:pop .6s 1.7s both,tw 1.8s 2.3s ease-in-out infinite alternate}
h1{font:700 27px "Cinzel",serif;letter-spacing:.06em;text-align:center;margin:0;background:linear-gradient(90deg,var(--gold),var(--teal),var(--em));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;color:var(--mu);margin:2px 0 14px;font-style:italic}
.so{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:12px 8px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.05);color:var(--ink);font:600 15px "Crimson Pro",serif;transition:transform .2s,border-color .2s}
.bt:hover{transform:translateY(-2px);border-color:var(--gold)}
.ic{font:700 13px Arial,sans-serif;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#4285f4}.ic.f{background:#1877f2}
.dv{display:flex;align-items:center;gap:10px;color:var(--mu);margin:14px 0}.dv::before,.dv::after{content:"";flex:1;height:1px;background:var(--ln)}
input{width:100%;box-sizing:border-box;padding:13px 14px;margin:5px 0;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:17px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(63,198,184,.2)}
.go{position:relative;overflow:hidden;cursor:pointer;width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;color:#fff;font:700 15px "Cinzel",serif;letter-spacing:.08em;background:linear-gradient(90deg,#7d55d7,#d9546e)}
.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:none}
@keyframes sh{60%,100%{left:130%}}
.lk{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
.sw,.gs{text-align:center;color:var(--mu);margin-top:12px;font-size:17px}
.msg{min-height:22px;text-align:center;font-size:15px;color:var(--teal);margin-top:6px}.msg.er{color:#ff8a9a}
.av{display:grid;place-items:center;width:92px;height:92px;margin:0 auto 8px;border-radius:50%;border:2px solid var(--gold);background:center/cover rgba(255,255,255,.07);font-size:46px;cursor:pointer;box-shadow:0 0 22px rgba(224,180,90,.35)}
.pr{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.pr button{cursor:pointer;font-size:22px;background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:50%;width:42px;height:42px}
.pr button:hover{border-color:var(--gold)}
.sub{color:var(--mu);margin:12px 0 6px;text-align:center}
.ch{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.ch button{cursor:pointer;color:var(--ink);font:inherit;font-size:16px;padding:6px 13px;border-radius:99px;border:1px solid var(--ln);background:rgba(255,255,255,.05);transition:all .2s}
.ch button.on{background:linear-gradient(90deg,#7d55d7,#d9546e);border-color:transparent;color:#fff;transform:scale(1.06)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.card::before,.ff,.lg,.go::after{animation:none!important}}

@keyframes spin{to{transform:rotate(360deg)}}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes tw{from{opacity:.2}to{opacity:1}}
:root{--cb:rgba(13,7,34,.58)}
:root[data-theme=light]{--cb:rgba(255,250,239,.8)}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:0 16px;box-sizing:border-box;overflow:hidden;font:19px/1.5 "Crimson Pro",Georgia,serif;color:var(--ink);background:radial-gradient(ellipse at 50% 50%,#1b0e40,#04020d 72%)}
:root[data-theme=light] body{background:radial-gradient(ellipse at 50% 50%,#fff3d2,#f4efe6 62%)}
#cel{--cs:min(150vmin,1100px);position:fixed;left:50%;top:50%;width:var(--cs);height:var(--cs);margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);z-index:1;pointer-events:none}
@media(max-width:600px){#cel{--cs:200vmin}}
#cel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.moon,.sun{position:absolute;inset:0}
.sun{display:none}
:root[data-theme=light] .moon{display:none}
:root[data-theme=light] .sun{display:block}
.hl{animation:br 8s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.06)}}
.rg2{will-change:transform}.a1{animation:spin 55s linear infinite}.a2{animation:spin 72s linear infinite reverse}.a3{animation:spin 88s linear infinite}.a4{animation:spin 104s linear infinite reverse}
.sun>div{position:absolute;inset:0}.ry,.fx,.cw,.sk{will-change:transform}.y1{animation:spin 110s linear infinite}.y2{animation:spin 80s linear infinite reverse}.fx{animation:spin 90s linear infinite}.cw{animation:spin 26s linear infinite reverse}
.pa{animation:pb 6s ease-in-out infinite alternate}.pb{animation:pb 7s ease-in-out -3s infinite alternate}@keyframes pb{from{transform:scale(.97)}to{transform:scale(1.05)}}
.sk{animation:shk 5s ease-out infinite}@keyframes shk{from{transform:scale(.9);opacity:.7}to{transform:scale(1.9);opacity:0}}
.lite .sk{display:none}
.lite #cel *{animation:none!important}.lite #cel *{will-change:auto}
@media(prefers-reduced-motion:reduce){#cel *{animation:none!important}.sk{display:none}}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 18px 10px}
.brand{font:700 18px Cinzel,serif;letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.rt{display:flex;gap:10px;align-items:center}
#lb{color:var(--ink);background:var(--cb)}
.card{position:relative;z-index:5;width:min(100%,380px);max-height:calc(100svh - 120px);overflow:auto;box-sizing:border-box;padding:22px 22px 20px;border-radius:24px;border:1px solid var(--ln);background:var(--cb);box-shadow:0 0 70px rgba(125,85,215,.3),0 20px 60px rgba(0,0,0,.35);animation:up .9s cubic-bezier(.2,.8,.2,1) both}
:root[data-theme=light] .card{box-shadow:0 0 70px rgba(255,179,71,.35),0 20px 50px rgba(93,62,122,.18)}
.card .lg{width:70px;height:70px}
.ph{text-align:center;font:700 24px Cinzel,serif;letter-spacing:.1em;background:linear-gradient(90deg,var(--gold),var(--teal),var(--em));-webkit-background-clip:text;background-clip:text;color:transparent}
.lite .lg{animation:none}
@media(max-width:480px){.brand{font-size:14px}#ln{display:none}.rt{gap:7px}}

</style>
