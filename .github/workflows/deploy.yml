name: Build and publish site

# Rebuilds the book pages from your database and publishes the whole site.
# It runs when you upload files, every 30 minutes, and when you press "Run workflow".
# On the automatic runs it only publishes when something actually changed (a new book,
# a new chapter, an edit), so a book you publish appears on the site within about 30 minutes.
# build-extras.mjs adds the home page text for search engines and the RSS feed.
# Before publishing, check-build.mjs stops the run if the build looks broken
# (for example 0 books), so the live site is never replaced by an empty one.
#
# Publishing is a separate job with a short wait and retries. GitHub sometimes cannot find a
# file it uploaded a split second earlier (actions/deploy-pages issue 451); this works around it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the book count dropped"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image tool (optional)
        continue-on-error: true
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Build book pages
        run: node build-pages.mjs
      - name: Add home page text, RSS feed and sitemap entries
        run: node .github/workflows/build-extras.mjs
      - name: Check the build
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/workflows/check-build.mjs
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.changed == 'true'
        with:
          path: dist
      # GitHub switches off scheduled runs after 60 days without changes to the repository.
      # Re-enabling the workflow on every run resets that timer, so the schedule never stops.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to register the upload
        run: sleep 20
      - name: Publish
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait, then try again
        if: steps.d1.outcome == 'failure'
        run: sleep 45
      - name: Publish (second try)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait, then try once more
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90
      - name: Publish (last try)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
