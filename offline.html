<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04020d">
<title>Offline · Ui Books</title>
<style>
:root{color-scheme:dark;--ink:#f4ead2;--mu:#a9a1c8;--ln:rgba(190,160,255,.2);--gold:#e0b45a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 120%,#2a0f5c,transparent 62%),#04020d;color:var(--ink);font:18px/1.6 Georgia,serif;text-align:center}
main{max-width:460px}
.mark{font:700 54px Georgia,serif;color:var(--gold);text-shadow:0 0 22px rgba(224,180,90,.6);margin-bottom:6px}
h1{font-size:26px;color:var(--gold);margin-bottom:10px;font-weight:500}
p{color:var(--mu);margin-bottom:14px}
button,a.btn{display:inline-block;border:0;border-radius:10px;padding:12px 24px;font:700 12px Georgia,serif;letter-spacing:.1em;background:linear-gradient(135deg,var(--gold),#b9822f);color:#2a1606;cursor:pointer;text-decoration:none}
</style>
</head>
<body><main>
<div class="mark">Ui</div>
<h1>You are offline</h1>
<p>The lantern has gone quiet because there is no internet connection right now. Chapters you have already opened on this device may still open from your history.</p>
<p><button type="button" onclick="location.reload()">TRY AGAIN</button></p>
</main></body></html>
