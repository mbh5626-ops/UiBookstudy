/* ---------- covers ---------- */
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=function(){URL.revokeObjectURL(u);rej({message:"That file is not a picture we can read."})};i.src=u})}
async function toCover(file){
 var img=await loadImg(file),w=img.naturalWidth||1,h=img.naturalHeight||1,k=Math.min(1,900/w,1260/h),c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 function blob(t,q){return new Promise(function(r){c.toBlob(r,t,q)})}
 var types=["image/webp","image/jpeg"],qs=[.86,.74,.6,.5];
 for(var i=0;i<types.length;i++)for(var j=0;j<qs.length;j++){var b=await blob(types[i],qs[j]);if(b&&b.type===types[i]&&b.size<=2900000)return b}
 throw{message:"That picture is too large. Try a smaller one."}}
async function uploadCover(file){
 var b=bookById(S.bookId);if(!file)return;
 if(!/^image\//.test(file.type)){toast("Please choose a picture.",true);return}
 toast("Uploading cover\u2026");
 var r=await run(null,async function(){
  var blob=await toCover(file),ext=blob.type==="image/webp"?"webp":"jpg",path=b.id+"/"+Date.now()+"."+ext,st=sb.storage.from("book-covers");
  var up=await st.upload(path,blob,{contentType:blob.type,cacheControl:"31536000",upsert:false});if(up.error)throw up.error;
  var url=st.getPublicUrl(path).data.publicUrl,row;
  try{row=one(await sb.from("books").update({cover_url:url,cover_path:path}).eq("id",b.id).select(BCOLS))}catch(e){await st.remove([path]);throw e}
  if(b.cover_path&&b.cover_path!==path)await st.remove([b.cover_path]);
  return row},"Cover saved.");
 if(r){Object.assign(b,r);paintEditor()}}
async function removeCover(btn){
 var b=bookById(S.bookId);if(!confirm("Remove this cover? The generated artwork will be used instead."))return;
 var r=await run(btn,async function(){var row=one(await sb.from("books").update({cover_url:null,cover_path:null}).eq("id",b.id).select(BCOLS));if(b.cover_path)await sb.storage.from("book-covers").remove([b.cover_path]);return row},"Cover removed.");

 '<div class="gl sec"><h2>Light / dark button</h2><p class="sub">The floating button that switches the website theme.</p>'+sw("s-tt","Show the theme button",tt.enabled!==false)+'<div class="acts"><button class="btn" data-act="settheme">SAVE</button></div></div>'+
 '<div class="gl sec"><h2>Floating widget</h2><p class="sub">A small button that floats on every page (for example, a Discord invite or a donation link).</p>'+sw("w-on","Show the widget",w.enabled===true)+'<label class="l" for="w-l">Button text (up to 40 characters)</label><input id="w-l" maxlength="40" dir="auto" value="'+esc(w.label||"")+'"><label class="l" for="w-u">Link (starts with https://)</label><input id="w-u" type="url" maxlength="300" value="'+esc(w.url||"")+'" placeholder="https://"><div class="row2"><div><label class="l" for="w-p">Position</label><select id="w-p"><option value="left"'+(w.position==="right"?'':' selected')+'>Bottom left</option><option value="right"'+(w.position==="right"?' selected':'')+'>Bottom right</option></select></div><div><label class="l" for="w-s">Colour</label><select id="w-s">'+["gold","teal","crimson"].map(function(c){return'<option value="'+c+'"'+((w.style||"gold")===c?' selected':'')+'>'+c[0].toUpperCase()+c.slice(1)+'</option>'}).join("")+'</select></div></div><div class="msg er" id="w-m" role="status"></div><div class="acts"><button class="btn" data-act="setwidget">SAVE WIDGET</button></div></div>'}
async function putSetting(btn,key,val,ok){
 return run(btn,async function(){var x=await sb.rpc("admin_set_setting",{p_key:key,p_value:val});if(x.error)throw x.error;return true},ok)}
function setWidget(btn){
 var on=$("w-on").checked,l=$("w-l").value.trim(),u=$("w-u").value.trim(),m=$("w-m");m.textContent="";
 if(on&&!l){m.textContent="Enter the button text first.";return}
 if(u&&!/^https:\/\//.test(u)){m.textContent="The link must start with https://";return}
 putSetting(btn,"floating_widget",{enabled:on,label:l,url:u,position:$("w-p").value,style:$("w-s").value},"Widget saved.")}

/* ---------- activity log ---------- */
var AL={"book.create":"Created book","book.update":"Edited book","book.publish":"Published book","book.unpublish":"Unpublished book","book.cover":"Changed cover","book.comments":"Changed comments setting","book.delete":"Deleted book","chapter.create":"Added chapter","chapter.update":"Edited chapter","chapter.delete":"Deleted chapter","chapter.reorder":"Reordered chapters","comment.hide":"Hid comment","comment.show":"Restored comment","comment.delete":"Deleted comment","review.hide":"Hid review","review.show":"Restored review","review.delete":"Deleted review","report.resolved":"Resolved report","report.dismissed":"Dismissed report","settings.update":"Changed setting"};
async function viewLog(){
 var v=$("view");v.innerHTML='<p class="sub">Loading…</p>';
 try{await loadBooks()}catch(e){}
 var rows;try{rows=ck(await sb.from("admin_audit_log").select("id,at,actor_id,actor_name,action,target_type,target_id,details").order("at",{ascending:false}).range(0,S.log.n-1))||[]}catch(e){v.innerHTML=errBox(fe(e));return}
 v.innerHTML=rows.length?rows.map(function(r){var d=r.details||{},what=d.title||(r.target_type==="book"?bTitle(r.target_id):"")||(d.book_id?bTitle(d.book_id):"")||r.target_id||"",ex=Array.isArray(d.changed)&&d.changed.length?" ("+d.changed.join(", ")+")":"";
  return'<div class="item"><div class="meta"><b>'+esc(AL[r.action]||r.action)+'</b> <span class="sub">\u00b7 '+esc(dt(r.at))+'</span></div><p>'+esc(what)+esc(ex)+'</p><span class="sub" style="font-size:14px">by '+esc(r.actor_name||(r.actor_id?String(r.actor_id).slice(0,8):"system"))+'</span></div>'}).join("")+(rows.length>=S.log.n?'<button class="btn g" data-act="logmore" style="width:100%">LOAD MORE</button>':''):'<p class="sub">No activity recorded yet.</p>'}

/* ---------- authors: submit a book, review applications ---------- */
async function submitBook(btn){
 var b=bookById(S.bookId);if(!confirm("Submit this book for review? The site owner will check it before publishing."))return;
 var r=await run(btn,async function(){var x=await sb.rpc("submit_book",{p_book:b.id});if(x.error)throw x.error;return true},"Submitted. You will see it published once it is approved.");
 if(r){b.submitted_at=new Date().toISOString();paintEditor();refreshCounts()}}
async function viewApplications(){
 var v=$("view"),st=S.apSt||"pending";v.innerHTML='<p class="sub">Loading…</p>';
 var rows;try{var x=await sb.rpc("admin_list_applications",{p_status:st});if(x.error)throw x.error;rows=x.data||[]}catch(e){v.innerHTML=errBox(fe(e));return}
 v.innerHTML='<div class="sub2">'+[["pending","Waiting"],["approved","Approved"],["rejected","Declined"],["revoked","Removed"]].map(function(s){return'<button class="chip'+(st===s[0]?' on':'')+'" data-act="apst" data-st="'+s[0]+'">'+s[1]+'</button>'}).join("")+'</div>'+
 (rows.length?rows.map(function(a){return'<div class="item"><div class="meta"><b dir="auto">'+esc(a.pen_name)+'</b> <span class="sub">\u00b7 '+esc(dt(a.created_at))+'</span></div>'+
  '<p class="sm2">Account: '+esc(a.display_name||"reader")+' \u00b7 '+(a.email?'<a href="mailto:'+esc(a.email)+'">'+esc(a.email)+'</a>':"no email")+(a.books_count?' \u00b7 '+esc(a.books_count)+' book(s)':'')+'</p>'+
  (a.genres?'<p class="sm2">Writes: '+esc(a.genres)+'</p>':'')+'<p class="bd" dir="auto">'+esc(a.bio)+'</p>'+(a.links?'<p class="sm2">Links: '+linkify(a.links)+'</p>':'')+
  '<details><summary>READ THE WRITING SAMPLE</summary><p class="bd" dir="auto" style="margin-top:6px">'+esc(a.sample)+'</p></details>'+
  (a.note?'<p class="sm2" style="margin-top:6px">Your note: '+esc(a.note)+'</p>':'')+
  '<div class="acts">'+(a.status==="pending"?'<button class="btn t sm" data-act="aprev" data-do="approve" data-id="'+esc(a.id)+'" data-name="'+esc(a.pen_name)+'">APPROVE</button><button class="btn g sm" data-act="aprev" data-do="reject" data-id="'+esc(a.id)+'" data-name="'+esc(a.pen_name)+'">DECLINE</button>':'')+(a.status==="approved"?'<button class="btn dg sm" data-act="aprev" data-do="revoke" data-id="'+esc(a.user_id)+'" data-name="'+esc(a.pen_name)+'">REMOVE AUTHOR ACCESS</button>':'')+'</div></div>'}).join(""):'<p class="sub">Nothing here.</p>')}
function reviewModal(d){
 var t={approve:["Approve "+d.name,"APPROVE","t","Optional welcome note for the author"],reject:["Decline "+d.name,"DECLINE","g","Optional reason (the applicant can read it)"],revoke:["Remove author access for "+d.name,"REMOVE ACCESS","dg","Optional reason (the author can read it)"]}[d["do"]];
 openModal('<h2>'+esc(t[0])+'</h2>'+(d["do"]==="approve"?'<p class="sub">They will be able to create books and chapters of their own, and submit them to you. They cannot publish or touch anyone else\u2019s books.</p>':d["do"]==="revoke"?'<p class="sub">They lose access to the author tools. Their books stay on the site until you change them.</p>':'')+'<form id="apf" data-do="'+esc(d["do"])+'" data-id="'+esc(d.id)+'"><label class="l" for="apn">'+esc(t[3])+'</label><textarea id="apn" maxlength="500" dir="auto"></textarea><div class="acts"><button class="btn '+t[2]+'" type="submit">'+t[1]+'</button><button class="btn g" type="button" data-act="mclose">CANCEL</button></div></form>')}
async function reviewDo(f){
 var d=f.dataset,btn=f.querySelector("[type=submit]"),note=$("apn").value.trim();
 var r=await run(btn,async function(){var x=d["do"]==="revoke"?await sb.rpc("revoke_author",{p_user:d.id,p_note:note}):await sb.rpc("review_application",{p_id:d.id,p_decision:d["do"],p_note:note});if(x.error)throw x.error;return true},d["do"]==="approve"?"Approved. They now have author access.":d["do"]==="reject"?"Application declined.":"Author access removed.");
 if(r){closeModal();await viewApplications();refreshCounts()}}
async function viewInbox(){
 var v=$("view"),st=S.msSt||"new";v.innerHTML='<p class="sub">Loading…</p>';
 var rows;try{var q=sb.from("contact_messages").select("id,name,email,message,status,created_at").order("created_at",{ascending:false}).limit(100);if(st!=="all")q=q.eq("status",st);rows=ck(await q)||[]}catch(e){v.innerHTML=errBox(fe(e));return}
 v.innerHTML='<div class="sub2">'+[["new","New"],["read","Read"],["archived","Archived"],["all","All"]].map(function(s){return'<button class="chip'+(st===s[0]?' on':'')+'" data-act="msst" data-st="'+s[0]+'">'+s[1]+'</button>'}).join("")+'</div>'+
 (rows.length?rows.map(function(m){return'<div class="item"><div class="meta"><b dir="auto">'+esc(m.name)+'</b> <span class="sub">\u00b7 <a href="mailto:'+esc(m.email)+'">'+esc(m.email)+'</a> \u00b7 '+esc(dt(m.created_at))+'</span> '+(m.status==="new"?'<span class="badge sbm">NEW</span>':'')+'</div><p class="bd" dir="auto">'+esc(m.message)+'</p><div class="acts">'+(m.status!=="read"?'<button class="btn g sm" data-act="msact" data-do="read" data-id="'+esc(m.id)+'">MARK READ</button>':'<button class="btn g sm" data-act="msact" data-do="new" data-id="'+esc(m.id)+'">MARK NEW</button>')+(m.status!=="archived"?'<button class="btn g sm" data-act="msact" data-do="archived" data-id="'+esc(m.id)+'">ARCHIVE</button>':'')+'<button class="btn dg sm" data-act="msact" data-do="delete" data-id="'+esc(m.id)+'">DELETE</button></div></div>'}).join(""):'<p class="sub">No messages here.</p>')}
async function messageDo(btn){
 var d=btn.dataset;if(d["do"]==="delete"&&!confirm("Delete this message permanently?"))return;
 var r=await run(btn,async function(){var x=d["do"]==="delete"?await sb.from("contact_messages").delete().eq("id",d.id).select("id"):await sb.from("contact_messages").update({status:d["do"]}).eq("id",d.id).select("id");return one(x)});
 if(r){await viewInbox();refreshCounts()}}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var x=e.target.closest&&e.target.closest("[data-act]");if(!x)return;var a=x.dataset.act;
 if(a==="go")go(x.dataset.tab);
 else if(a==="signout"){sb.auth.signOut().then(function(){S.me=null;S.owner=false;S.perms={};showLogin()})}
 else if(a==="mclose")closeModal();
 else if(a==="newbook")openNew();
 else if(a==="openbook")openBook(x.dataset.id);
 else if(a==="back")viewBooks();
 else if(a==="publish")setPublished(x);
 else if(a==="submit")submitBook(x);
 else if(a==="subfilter"){S.fSub=!S.fSub;if(S.tab!=="books")go("books");else if(!S.bookId)paintBookList();else viewBooks()}
 else if(a==="apst"){S.apSt=x.dataset.st;viewApplications()}
 else if(a==="aprev")reviewModal(x.dataset);
 else if(a==="msst"){S.msSt=x.dataset.st;viewInbox()}
 else if(a==="msact")messageDo(x);
 else if(a==="coverdel")removeCover(x);
 else if(a==="chadd")chapModal({title:"Chapter "+(S.chapters.reduce(function(m,c){return Math.max(m,c.chapter_number)},0)+1),content:""},true);
 else if(a==="chedit")openChapter(x.dataset.id);
 else if(a==="chup")reorder(x.dataset.id,-1);
 else if(a==="chdn")reorder(x.dataset.id,1);
 else if(a==="chdel")delChapter(x.dataset.id);
 else if(a==="bookdel")delBookModal();
 else if(a==="bookdelgo")delBook(x);
 else if(a==="cmsub"){S.cm.sub=x.dataset.sub;S.cm.n=30;viewComments()}
 else if(a==="cmmore"){S.cm.n+=30;paintCommunity()}
 else if(a==="cmtoggle")toggleBookComments(x);
 else if(a==="mod")moderate(x);
 else if(a==="rp")reportDo(x);
 else if(a==="setfeat")putSetting(x,"features",{comments:$("s-cm").checked,reviews:$("s-rv").checked},"Saved.");
 else if(a==="settheme")putSetting(x,"theme_toggle",{enabled:$("s-tt").checked},"Saved.");
 else if(a==="setwidget")setWidget(x);
 else if(a==="logmore"){S.log.n+=50;viewLog()}
});
document.addEventListener("submit",function(e){var f=e.target;
 if(f.id==="lf"){e.preventDefault();var b=f.querySelector("[type=submit]");b.disabled=true;$("lm").textContent="";
  sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value}).then(function(r){b.disabled=false;if(r.error)$("lm").textContent=/invalid/i.test(r.error.message||"")?"Wrong email or password.":fe(r.error)}).catch(function(){b.disabled=false;$("lm").textContent="Network problem. Please try again."})}
 else if(f.id==="nbf"){e.preventDefault();createBook(f)}
 else if(f.id==="bf"){e.preventDefault();saveDetails(f)}
 else if(f.id==="cf"){e.preventDefault();saveChapter(f)}
 else if(f.id==="apf"){e.preventDefault();reviewDo(f)}});
document.addEventListener("change",function(e){var t=e.target;
 if(t.dataset&&t.dataset.cover){var f=t.files&&t.files[0];t.value="";uploadCover(f)}
 else if(t.dataset&&t.dataset.actChange==="bookcomments")setBookComments(t);
 else if(t.id==="cmbook"){S.cm.book=t.value;S.cm.n=30;paintCommunity()}
 else if(t.id==="cmstat"){S.cm.status=t.value;S.cm.n=30;paintCommunity()}});
document.addEventListener("input",function(e){if(e.target.id==="bq"){S.q=e.target.value;paintBookList()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("mo").hidden)closeModal()});

/* ---------- boot ---------- */
(async function(){
 if(!sb){start();return}
 try{var r=await sb.auth.getSession();S.me=r.data&&r.data.session?r.data.session.user:null}catch(e){S.me=null}
 sb.auth.onAuthStateChange(function(ev,s){var u=s?s.user:null;if((u&&u.id)!==(S.me&&S.me.id)){S.me=u;setTimeout(start,0)}});
 start()})();
})();
</script>
